[project]
name = "felix-lm"
version = "0.1.0"
requires-python = ">=3.12"
description = "Felix-LM: Multi-Stream Progressive Merging for Causal Language Modeling"
license = {text = "MIT"}

dependencies = [
    "numpy>=1.26",
    "datasets>=2.18",
    "tokenizers>=0.15",
    "transformers>=4.38",
    "wandb>=0.16",
    "einops>=0.7",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["felix_lm*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
